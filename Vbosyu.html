<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="新たな可能性をみんなで実現。その一歩を踏み出そう">
    <link rel="stylesheet" href="style.css">
    <title>新たなvirtualの可能性を求む</title>
</head>

<body>

    <canvas id="suich" class="interactive-canvas"></canvas>

    <div id="Afade" style="display:none;"> <p>スイッチをクリックしてくれますか？</p>
    </div>

    <div id="Bfade" style="display:none;">
        <p>あなたの勇気に感謝します。<br>押してくれてありがとう<br>この選択が始まりの一歩です！</p>
    </div>

    <header id="startHeader" style="display:none;">
        <a href="Vbosyu.html">
            <h2>ここからスタート</h2>
        </a>
        <nav id="nav-pc">
            <a href="Vbosyu.html">概要</a>
            <a href="">応募フォーム</a>
        </nav>
    </header>

    <nav class="imisinn" style="display:none;">
        わたしはユウ　Youも世界を変えたい？
        <br>見るがわじゃなくて　作る側へ
        <img src="">
        <p>想像を創造　形へ<br>未来を創る一歩を</p>
    </nav>

    <div class="coming" style="display:none;"> coming soon
    </div>

    <script type="text/javascript">
        const canvas = document.getElementById("suich");
        const ctx = canvas.getContext("2d");
        const ctx1 = canvas.getContext('2d');
        const ctx2 = canvas.getContext('2d');

        // レスポンシブ対応：画面サイズに応じてCanvasサイズを調整
        function resizeCanvas() {
            const maxSize = 800;
            const windowWidth = window.innerWidth;
            const canvasSize = Math.min(maxSize, windowWidth * 0.9); // 画面幅の90%、最大800px

            canvas.width = canvasSize;
            canvas.height = canvasSize;

            // スケール比率を計算（800pxを基準）
            return canvasSize / 800;
        }

        function drawRed() {
            const scale = resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // ... (drawRed 関数の内容は省略) ...
            // スケール適用
            ctx.save();
            ctx.scale(scale, scale);

            // === 赤LED描画処理 ===
            var gr = ctx.createRadialGradient(400, 100, 5, 400, 150, 65);
            gr.addColorStop(0, 'white');
            gr.addColorStop(0.3, 'lightcoral');
            gr.addColorStop(1, 'red');
            ctx.fillStyle = gr;

            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.ellipse(400, 150, 45, 75, Math.PI / 2, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(400, 150, 40, 70, Math.PI / 2, 0, 2 * Math.PI);
            ctx.fill();

            //円形グラデーション
            var gb = ctx1.createConicGradient(Math.PI, 400, 400);
            //色
            gb.addColorStop(0, 'dimgray');
            gb.addColorStop(0.1, 'gray');
            gb.addColorStop(0.2, 'darkgray');
            gb.addColorStop(0.3, 'gainsboro');
            gb.addColorStop(0.4, 'silver');
            gb.addColorStop(0.5, 'gray');
            gb.addColorStop(0.7, 'silver');
            gb.addColorStop(0.8, 'darkgray');
            gb.addColorStop(0.9, 'gray');
            gb.addColorStop(1, 'dimgray');
            ctx1.fillStyle = gb;
            //サイズ
            ctx1.lineWidth = 30;
            ctx1.beginPath();
            ctx1.arc(400, 400, 80, 0, Math.PI * 2, true);
            ctx1.fill();

            var g = ctx2.createRadialGradient(400, 400, 20, 400, 400, 50);

            // 色
            g.addColorStop(0, 'white');
            g.addColorStop(0.7, 'gray');
            g.addColorStop(1, 'black');
            ctx2.fillStyle = g;
            //トグルスイッチの線の幅
            ctx2.lineWidth = 3;
            //外側縁
            ctx2.beginPath();
            ctx2.arc(400, 400, 80, 0, Math.PI * 2, false);
            ctx2.stroke();
            //縁
            ctx2.beginPath();
            ctx2.arc(400, 400, 55, 0, Math.PI * 2, true);
            ctx2.fill();
            //トグルの根本 半円
            ctx2.beginPath();
            ctx2.arc(400, 410, 10, 0, Math.PI, true);
            ctx2.stroke();
            //根本の線
            ctx2.beginPath();
            ctx2.moveTo(390, 410);
            ctx2.lineTo(390, 429);
            ctx2.stroke();
            //根本の線
            ctx2.beginPath();
            ctx2.moveTo(410, 410);
            ctx2.lineTo(410, 429);
            ctx2.stroke();
            //トグル太いところ根本　半円
            ctx2.beginPath();
            ctx2.arc(400, 445, 20, 0, Math.PI, true);
            ctx2.stroke();
            //トグル太いところの線
            ctx2.beginPath();
            ctx2.moveTo(380, 443);
            ctx2.lineTo(370, 525);
            ctx2.stroke();
            //トグル太いところの線
            ctx2.beginPath();
            ctx2.moveTo(420, 443);
            ctx2.lineTo(430, 525);
            ctx2.stroke();
            //トグル先端
            ctx2.beginPath();
            ctx2.arc(400, 525, 30, 0, Math.PI * 2, true);
            ctx2.stroke();

            ctx.restore();
        }

        function drawGreen() {
            const scale = resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // スケール適用
            ctx.save();
            ctx.scale(scale, scale);

            // === 緑LED描画処理 ===
            var gr = ctx.createRadialGradient(400, 100, 5, 400, 150, 65);
            gr.addColorStop(0, 'white');
            gr.addColorStop(0.2, 'aquamarine');
            gr.addColorStop(1, 'green');
            ctx.fillStyle = gr;

            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.ellipse(400, 150, 45, 75, Math.PI / 2, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.beginPath();
            ctx.ellipse(400, 150, 40, 70, Math.PI / 2, 0, 2 * Math.PI);
            ctx.fill();

            var gb = ctx1.createConicGradient(Math.PI, 400, 400);
            //色
            gb.addColorStop(0, 'dimgray');
            gb.addColorStop(0.1, 'gray');
            gb.addColorStop(0.2, 'darkgray');
            gb.addColorStop(0.3, 'gainsboro');
            gb.addColorStop(0.4, 'silver');
            gb.addColorStop(0.5, 'gray');
            gb.addColorStop(0.7, 'silver');
            gb.addColorStop(0.8, 'darkgray');
            gb.addColorStop(0.9, 'gray');
            gb.addColorStop(1, 'dimgray');
            ctx1.fillStyle = gb;
            //サイズ
            ctx1.lineWidth = 30;
            ctx1.beginPath();
            ctx1.arc(400, 400, 80, 0, Math.PI * 2, true);
            ctx1.fill();

            var g = ctx2.createRadialGradient(400, 400, 20, 400, 400, 50);

            // 色
            g.addColorStop(0, 'white');
            g.addColorStop(0.7, 'gray');
            g.addColorStop(1, 'black');
            ctx2.fillStyle = g;
            //トグルスイッチの線の幅
            ctx2.lineWidth = 3;
            //外側縁
            ctx2.beginPath();
            ctx2.arc(400, 400, 80, 0, Math.PI * 2, false);
            ctx2.stroke();
            //縁
            ctx2.beginPath();
            ctx2.arc(400, 400, 55, 0, Math.PI * 2, true);
            ctx2.fill();

            //トグルの根本 半円
            ctx2.beginPath();
            ctx2.arc(400, 410, 10, 0, Math.PI, false);
            ctx2.stroke();
            //根本の線
            ctx2.beginPath();
            ctx2.moveTo(390, 390);
            ctx2.lineTo(390, 410);
            ctx2.stroke();
            //根本の線
            ctx2.beginPath();
            ctx2.moveTo(410, 390);
            ctx2.lineTo(410, 410);
            ctx2.stroke();
            //トグル太いところ根本　半円
            ctx2.beginPath();
            ctx2.arc(400, 375, 20, 0, Math.PI, false);
            ctx2.stroke();
            //トグル太いところの線
            ctx2.beginPath();
            ctx2.moveTo(370, 275);
            ctx2.lineTo(380, 380);
            ctx2.stroke();
            //トグル太いところの線
            ctx2.beginPath();
            ctx2.moveTo(430, 275);
            ctx2.lineTo(420, 380);
            ctx2.stroke();
            //トグル先端
            ctx2.beginPath();
            ctx2.arc(400, 270, 30, 0, Math.PI * 2, true);
            ctx2.stroke();

            ctx.restore();
        }

        // 現在の状態を保持
        let currentState = 'red'; // 'red', 'green', 'none'のいずれか

        // 初期表示（赤）とクリック促しテキストの表示
        drawRed();
        document.getElementById("Afade").style.display = "block"; // ページロード後にAfadeを表示

        // ウィンドウリサイズ時に現在の状態に応じて再描画
        window.addEventListener('resize', () => {
            if (currentState === 'red') {
                drawRed();
            } else if (currentState === 'green') {
                drawGreen();
            }
            // currentState === 'none'の場合は何も描画しない
        });

        canvas.addEventListener("click", () => {
            // currentState が 'none' の場合は何もしない
            if (currentState === 'none') {
                return;
            }
            // クリック直後：緑LEDを描画
            currentState = 'green';
            drawGreen();

            // Afadeを消す
            document.getElementById("Afade").style.display = "none";

            // === 1.5秒後：Canvasと緑LEDを消去 ===
            setTimeout(() => {
                // 緑LEDを消去（Canvas全体をクリア）
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Canvas要素自体を非表示にして、クリックイベントも無効にする
                canvas.style.display = "none";

                currentState = 'none'; // 状態を 'none' に変更

                document.getElementById("Bfade").style.display = "block";

                // === さらに3秒後（合計4.5秒時点）===
                setTimeout(() => {
                    document.getElementById("Bfade").style.display = "none";
                    document.getElementById("startHeader").style.display = "flex";
                    document.querySelector(".imisinn").style.display = "block";
                    document.querySelector(".coming").style.display = "block";
                }, 3000);

            }, 1500); // 1.5秒後に実行
        });
    </script>
</body>

</html>
